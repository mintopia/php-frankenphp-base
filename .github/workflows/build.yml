name: Build and Push Docker Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
        variant: ["base", "dev"]
    continue-on-error: ${{ matrix.php == '8.5' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: tags
        run: |
          TAGS="ghcr.io/mintopia/frankenphp-base"
          PHP="${{ matrix.php }}"
          VARIANT="${{ matrix.variant }}"

          TAG_LIST=""
          if [ "$VARIANT" = "base" ]; then
            TAG_LIST="${TAGS}:${PHP}"
            if [ "$PHP" = "8.4" ]; then
              TAG_LIST="${TAG_LIST},${TAGS}:stable"
            fi
            if [ "$PHP" = "8.5" ]; then
              TAG_LIST="${TAG_LIST},${TAGS}:latest"
            fi
          else
            TAG_LIST="${TAGS}:${PHP}-dev"
            if [ "$PHP" = "8.4" ]; then
              TAG_LIST="${TAG_LIST},${TAGS}:stable-dev"
            fi
            if [ "$PHP" = "8.5" ]; then
              TAG_LIST="${TAG_LIST},${TAGS}:latest-dev"
            fi
          fi

          echo "tags=${TAG_LIST}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64,linux/arm64
          target: ${{ matrix.variant }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (base)
        if: matrix.variant == 'base'
        run: |
          docker buildx build --load --target base --build-arg PHP_VERSION=${{ matrix.php }} -t test-image .
          docker run --rm test-image php -m | grep -q bcmath
          docker run --rm test-image php -m | grep -q grpc
          docker run --rm test-image php -m | grep -q opentelemetry
          docker run --rm test-image php -m | grep -q pcntl
          docker run --rm test-image php -m | grep -q redis
          docker run --rm test-image php -m | grep -q protobuf
          docker run --rm test-image php -m | grep -q pdo_mysql
          docker run --rm test-image php -m | grep -q gd
          docker run --rm test-image php -m | grep -q "Zend OPcache"
          echo "All extensions verified for PHP ${{ matrix.php }}!"

      - name: Smoke test (dev)
        if: matrix.variant == 'dev'
        run: |
          docker buildx build --load --target dev --build-arg PHP_VERSION=${{ matrix.php }} -t test-image-dev .
          docker run --rm test-image-dev php -m | grep -q xdebug
          docker run --rm test-image-dev composer --version
          docker run --rm test-image-dev node --version
          echo "Dev tools verified for PHP ${{ matrix.php }}!"
